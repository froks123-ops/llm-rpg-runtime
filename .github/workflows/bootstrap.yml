name: Bootstrap RPG Runtime v0.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack runtime
        shell: bash
        run: |
          set -euo pipefail
          test -f llm-rpg-runtime-v0.1.0.zip
          rm -rf .bootstrap_tmp
          mkdir .bootstrap_tmp
          unzip -q llm-rpg-runtime-v0.1.0.zip -d .bootstrap_tmp
          cp -a .bootstrap_tmp/. .
          rm -rf .bootstrap_tmp
          rm -f llm-rpg-runtime-v0.1.0.zip
          rm -f .github/workflows/bootstrap.yml

      - name: Commit unpacked repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "bootstrap runtime v0.1.0"
          git push
          
