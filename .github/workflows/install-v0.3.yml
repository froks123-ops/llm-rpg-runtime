name: RPG Runtime CI / Update

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q runtime

      - name: Test
        run: python -m pytest -q

  update:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply runtime-update.zip
        shell: bash
        run: |
          set -euo pipefail
          test -f runtime-update.zip

          rm -rf .runtime_update_tmp
          mkdir .runtime_update_tmp
          unzip -q runtime-update.zip -d .runtime_update_tmp

          # Workflow files are maintained manually because GITHUB_TOKEN cannot
          # create/update workflow definitions without workflows permission.
          rm -rf .runtime_update_tmp/.github

          # Remove only runtime-owned paths. Unrelated user files survive.
          if [ -f .runtime-managed-paths ]; then
            while IFS= read -r managed; do
              [ -z "$managed" ] && continue
              rm -rf -- "$managed"
            done < .runtime-managed-paths
          fi

          cp -a .runtime_update_tmp/. .
          rm -rf .runtime_update_tmp
          rm -f runtime-update.zip

          # Never commit packaging/test artifacts.
          find . -maxdepth 2 -type d \( -name '*.egg-info' -o -name '.pytest_cache' -o -name '__pycache__' \) -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          # Fail closed if an update somehow touched workflow definitions.
          if ! git diff --quiet -- .github/workflows; then
            echo "ERROR: runtime update attempted to modify .github/workflows"
            git diff -- .github/workflows
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify candidate update
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m compileall -q runtime
          python -m pytest -q
          python - <<'PY'
          from runtime import __version__
          print(f"verified runtime {__version__}")
          PY

      - name: Clean generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 2 -type d \( -name '*.egg-info' -o -name '.pytest_cache' -o -name '__pycache__' \) -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "ERROR: refusing to commit workflow changes"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          VERSION=$(python - <<'PY'
          from runtime import __version__
          print(__version__)
          PY
          )
          git commit -m "runtime update v${VERSION}"
          git push
          
