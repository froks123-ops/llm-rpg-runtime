name: Install RPG Runtime v0.3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install v0.3 from runtime-update.zip
        shell: bash
        run: |
          set -euo pipefail
          test -f runtime-update.zip

          rm -rf .runtime_install_tmp
          mkdir .runtime_install_tmp
          unzip -q runtime-update.zip -d .runtime_install_tmp

          # GitHub's workflow token can write repository contents but cannot
          # create/update workflow files without the separate workflows permission.
          # Keep workflow installation as a manual, one-time step.
          rm -rf .runtime_install_tmp/.github

          # v0.1 does not yet have the permanent updater contract, so the first
          # upgrade removes only known runtime-owned non-workflow paths.
          for managed in \
            runtime schemas tests examples docs \
            README.md ATTRIBUTION.md LICENSE CHANGELOG.md pyproject.toml .gitignore \
            .runtime-managed-paths; do
            rm -rf -- "$managed"
          done

          cp -a .runtime_install_tmp/. .
          rm -rf .runtime_install_tmp
          rm -f runtime-update.zip

          # Editable installs create local packaging metadata. Never commit it.
          grep -qxF '*.egg-info/' .gitignore || printf '\n*.egg-info/\n' >> .gitignore

          # Workflows are managed manually and must not be treated as runtime-owned
          # files by the automatic updater.
          if [ -f .runtime-managed-paths ]; then
            sed -i '\|^\.github/workflows/|d' .runtime-managed-paths
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify installed runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m compileall -q runtime
          python -m pytest -q
          python - <<'PY'
          from runtime import __version__
          assert __version__ == "0.3.0", __version__
          print(f"verified runtime {__version__}")
          PY

      - name: Commit installed runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ./*.egg-info
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          # Safety gate: this install must not modify workflow files.
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "Refusing commit: workflow file change detected."
            git diff --cached --name-only
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "runtime update v0.3.0"
          git push
          
