[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rpg-runtime"
version = "0.1.0"
description = "Deterministic state, RNG, validation, retrieval and world-simulation support for long-running LLM RPG campaigns."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "froks123-ops"}
]
dependencies = [
  "jsonschema>=4.20,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
